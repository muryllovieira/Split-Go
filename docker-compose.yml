services:
  postgres:
    image: postgres:16-alpine
    container_name: splitandgo-db
    environment:
      POSTGRES_DB: splitandgo
      POSTGRES_USER: splitandgo
      POSTGRES_PASSWORD: splitandgo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitandgo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: splitandgo-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/splitandgo
      DB_USERNAME: splitandgo
      DB_PASSWORD: splitandgo
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: splitandgo-web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
