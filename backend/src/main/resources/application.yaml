spring:
  application:
    name: split-go-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/splitandgo}
    username: ${DB_USERNAME:splitandgo}
    password: ${DB_PASSWORD:splitandgo}
  jpa:
    # Schema é responsabilidade do Flyway; o Hibernate apenas valida
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
